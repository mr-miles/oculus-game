name: build-apk
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Android SDK, Gradle and Godot templates
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/setup-android.sh') }}

      - name: Setup, test, build and verify the APK
        run: mise run ci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-sentinel-debug-apk
          path: game/build/quest-sentinel.apk
          if-no-files-found: error
